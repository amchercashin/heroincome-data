name: Update Stock Dividends

on:
  schedule:
    # every Monday 05:17 UTC (08:17 MSK); GitHub may start it later under load
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: cd scripts && python -m stocks.scrape

      - name: Commit updated data (if changed)
        run: .github/scripts/commit-data.sh data/stocks/ "chore: update stock dividends $(date -u +%Y-%m-%d)"
