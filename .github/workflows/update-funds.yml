name: Update Fund Distributions

on:
  schedule:
    # every Monday 05:47 UTC (08:47 MSK); GitHub may start it later under load
    - cron: '47 5 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: cd scripts && python -m funds.scrape

      - name: Commit updated data (if changed)
        run: .github/scripts/commit-data.sh data/funds/ "chore: update fund distributions $(date -u +%Y-%m-%d)"
